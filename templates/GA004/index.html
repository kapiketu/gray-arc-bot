<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{business_name}} - {{category}}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary-color, #3b82f6)',
              secondary: 'var(--secondary-color, #1d4ed8)',
              dark: {
                950: '#030712',
                900: '#111827',
                800: '#1f2937',
                750: '#1f2937',
                700: '#374151'
              }
            },
            fontFamily: {
              display: ['var(--font-family, Outfit)', 'sans-serif'],
              sans: ['var(--font-family, Inter)', 'sans-serif']
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AOS Library for Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Custom Style Variables -->
    <style>
      :root {
        --primary-color: {{primary_color}};
        --primary-hover: {{primary_hover}};
        --secondary-color: {{secondary_color}};
        --bg-color: {{bg_color}};
        --surface-color: {{surface_color}};
        --card-color: {{card_color}};
        --border-color: {{border_color}};
        --text-color: {{text_color}};
        --text-secondary: {{text_secondary}};
        --font-family: {{font_family}};
      }
      body {
        font-family: var(--font-family, 'Inter'), sans-serif;
        background-color: var(--bg-color, #030712);
        color: var(--text-color, #f3f4f6);
        overflow-x: hidden;
      }
      .font-display {
        font-family: var(--font-family, 'Outfit'), sans-serif;
      }
      .glass {
        background: var(--card-color, rgba(255, 255, 255, 0.03));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color, rgba(255, 255, 255, 0.05));
      }
      .glass-card-hover {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-6px);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #030712;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
</head>
<body class="bg-dark-950 text-gray-100 antialiased selection:bg-primary selection:text-white">

    <!-- NAVIGATION HEADER -->
    <header class="fixed top-0 left-0 w-full z-50 glass border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{{home_link}}" class="flex items-center gap-3">
                {{logo}}
                <span class="text-xl font-bold font-display tracking-tight text-white">{{business_name}}</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="{{home_link}}" class="transition-colors {{home_active}}">Home</a>
                <a href="{{services_link}}" class="transition-colors {{services_active}}">Services</a>
                <a href="{{about_link}}" class="transition-colors {{about_active}}">Our Story</a>
                <a href="{{reviews_link}}" class="transition-colors {{reviews_active}}">Reviews</a>
                <a href="{{contact_link}}" class="transition-colors {{contact_active}}">Contact Us</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="tel:{{phone}}" class="hidden sm:flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition-colors">
                    <i data-lucide="phone" class="w-4 h-4 text-primary"></i>
                    <span>Call Us</span>
                </a>
                <a href="https://wa.me/{{phone_clean}}?text=Hi! I would like to make an enquiry." target="_blank" class="px-5 py-2.5 rounded-full bg-primary text-white font-semibold text-sm hover:opacity-90 transition-all flex items-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    <span>WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

    <!-- DYNAMIC COMPOSED SECTIONS -->
    <main class="pt-20">
        {{dynamic_hero}}
        {{dynamic_about}}
        {{dynamic_services}}
        {{dynamic_features}}
        {{dynamic_testimonials}}
        {{dynamic_faqs}}
    </main>

    <!-- DYNAMIC COMPOSED FOOTER -->
    {{dynamic_footer}}

    <!-- Initialize AOS and Lucide Icons -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        AOS.init({
          duration: 800,
          once: true,
          easing: 'ease-out-quad'
        });
        lucide.createIcons();
      });
    </script>
</body>
</html>
