<section class="services services-v2" style="padding: 5rem 2rem; background-color: hsl(var(--hue-primary), 10%, 99%);">
  <div class="container" style="max-width: 1200px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 3rem;">
      <h2 style="font-family: var(--font-heading); color: hsl(var(--hue-primary), 40%, 20%); font-size: 2.5rem; margin-bottom: 1rem;">
        {{section_title}}
      </h2>
      <p style="font-family: var(--font-body); color: hsl(var(--hue-primary), 20%, 40%); font-size: 1.125rem; max-width: 600px; margin: 0 auto;">
        {{section_subtitle}}
      </p>
    </div>
    
    <div class="services-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
      <!-- item:items -->
      <div class="service-card" style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s ease, box-shadow 0.2s ease;">
        <div class="icon-wrapper" style="width: 48px; height: 48px; border-radius: 8px; background-color: hsl(var(--hue-secondary), 30%, 90%); color: hsl(var(--hue-primary), 60%, 40%); display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
          <i data-lucide="{{icon}}" style="width: 24px; height: 24px;"></i>
        </div>
        <h3 style="font-family: var(--font-heading); font-size: 1.25rem; color: hsl(var(--hue-primary), 30%, 20%); margin-bottom: 0.75rem;">
          {{title}}
        </h3>
        <p style="font-family: var(--font-body); color: hsl(var(--hue-primary), 20%, 45%); line-height: 1.6;">
          {{desc}}
        </p>
      </div>
      <!-- enditem -->
    </div>
  </div>
</section>
