<section class="hero hero-v1" style="padding: 4rem 2rem; text-align: center; background-color: hsl(var(--hue-primary), 15%, 95%);">
  <div class="container" style="max-width: 800px; margin: 0 auto;">
    <h1 style="font-family: var(--font-heading); color: hsl(var(--hue-primary), 30%, 20%); font-size: 3rem; margin-bottom: 1rem;">
      {{headline}}
    </h1>
    <p style="font-family: var(--font-body); color: hsl(var(--hue-primary), 20%, 40%); font-size: 1.25rem; margin-bottom: 2rem;">
      {{subheadline}}
    </p>
    <a href="#contact" class="btn btn-primary" style="display: inline-block; padding: 1rem 2rem; background-color: hsl(var(--hue-primary), 60%, 50%); color: white; text-decoration: none; border-radius: 8px; font-family: var(--font-body); font-weight: 600;">
      {{cta_text}}
    </a>
  </div>
</section>
