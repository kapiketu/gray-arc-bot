<section class="hero hero-v3" style="position: relative; min-height: 80vh; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6rem 2rem; background: radial-gradient(circle at 10% 20%, hsl(var(--hue-primary), 15%, 12%) 0%, hsl(var(--hue-primary), 10%, 4%) 90%); color: white; text-align: center;">
  <!-- Glow Blob 1 -->
  <div style="position: absolute; top: 20%; left: 20%; width: 300px; height: 300px; background: hsl(var(--hue-primary), 60%, 50%); filter: blur(120px); opacity: 0.15; border-radius: 50%; pointer-events: none;"></div>
  <!-- Glow Blob 2 -->
  <div style="position: absolute; bottom: 20%; right: 20%; width: 350px; height: 350px; background: hsl(var(--hue-secondary), 50%, 50%); filter: blur(140px); opacity: 0.12; border-radius: 50%; pointer-events: none;"></div>

  <div class="container" style="max-width: 900px; position: relative; z-index: 10;">
    <div class="glass-panel" style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 4rem 3rem; border-radius: 32px; box-shadow: 0 40px 100px rgba(0,0,0,0.4);">
      <span style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.25rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; tracking-wider; color: hsl(var(--hue-secondary), 80%, 75%); margin-bottom: 2rem;">
        <span style="width: 8px; height: 8px; background: hsl(var(--hue-secondary), 80%, 65%); border-radius: 50%; animation: pulse 2s infinite;"></span>
        Featured Services
      </span>
      <h1 style="font-family: var(--font-heading); font-size: 3.5rem; line-height: 1.1; margin-bottom: 1.5rem; background: linear-gradient(135deg, #ffffff 0%, hsl(var(--hue-secondary), 80%, 90%) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        {{headline}}
      </h1>
      <p style="font-family: var(--font-body); font-size: 1.2rem; color: rgba(255,255,255,0.7); max-width: 700px; margin: 0 auto 2.5rem auto; line-height: 1.6;">
        {{subheadline}}
      </p>
      <div style="display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap;">
        <a href="#services" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1.1rem 2.5rem; background: linear-gradient(135deg, hsl(var(--hue-primary), 60%, 55%) 0%, hsl(var(--hue-primary), 60%, 45%) 100%); color: white; text-decoration: none; border-radius: 100px; font-family: var(--font-body); font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 0.2s ease, box-shadow 0.2s ease;">
          {{cta_primary}}
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </a>
        <a href="#contact" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1.1rem 2.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: white; text-decoration: none; border-radius: 100px; font-family: var(--font-body); font-weight: 700; transition: background 0.2s ease;">
          {{cta_secondary}}
        </a>
      </div>
    </div>
  </div>
</section>
