<section class="services services-v1" style="padding: 4rem 2rem;">
  <div class="container" style="max-width: 1000px; margin: 0 auto;">
    <h2 style="font-family: var(--font-heading); color: hsl(var(--hue-primary), 30%, 20%); font-size: 2.25rem; text-align: center; margin-bottom: 3rem;">
      {{section_title}}
    </h2>
    <div style="display: flex; flex-direction: column; gap: 2rem;">
      <!-- item:items -->
      <div style="display: flex; gap: 1.5rem; border-bottom: 1px solid hsl(var(--hue-primary), 20%, 90%); padding-bottom: 1.5rem;">
        <div style="color: hsl(var(--hue-secondary), 50%, 40%); padding-top: 0.25rem;">
          <i data-lucide="{{icon}}" style="width: 32px; height: 32px;"></i>
        </div>
        <div>
          <h3 style="font-family: var(--font-heading); font-size: 1.5rem; color: hsl(var(--hue-primary), 30%, 15%); margin-bottom: 0.5rem;">
            {{title}}
          </h3>
          <p style="font-family: var(--font-body); color: hsl(var(--hue-primary), 10%, 40%); font-size: 1.1rem;">
            {{desc}}
          </p>
        </div>
      </div>
      <!-- enditem -->
    </div>
  </div>
</section>
